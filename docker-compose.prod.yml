# 운영 서버용 (trip.trendkit.app).  개발용 docker-compose.yml 과 따로 쓴다.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 개발용과 다른 점
#   * DB 포트를 밖으로 열지 않는다
#   * API 는 127.0.0.1 에만 붙인다 — 바깥 요청은 nginx 또는 Cloudflare Tunnel 을 거쳐서만 들어온다
#   * 코드 폴더를 마운트하지 않고 이미지에 굽는다, --reload 없음
#   * PUBLIC=1 → API 문서·통계 닫힘, 사용량 제한 켜짐
#   * 수집기(ingest)는 profile tools 로만 뜬다. 서버 cron 이 매일 부른다 (scripts/daily_collect.sh)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: triprag-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triprag}
      POSTGRES_USER: ${POSTGRES_USER:-triprag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triprag} -d ${POSTGRES_DB:-triprag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: triprag-prod-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      PUBLIC: "1"
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*

  # 집 노트북처럼 공인 IP·포트포워딩 없이 공개할 때 (Cloudflare Tunnel).
  # nginx·인증서가 필요 없다. 켜기:  docker compose -f docker-compose.prod.yml --profile tunnel up -d
  # 토큰은 Cloudflare Zero Trust → Networks → Tunnels 에서 터널을 만들면 나온다 (.env 의 TUNNEL_TOKEN)
  # 터널의 Public Hostname 은  trip.trendkit.app → http://api:8000
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: triprag-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

  # 매일 수집·판정·색인. 상주하지 않고 cron 이 필요할 때만 띄운다 (scripts/daily_collect.sh):
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm -T ingest python -m ingest.daily --areas 39
  # 코드는 이미지에 굽지 않고 마운트한다 → 서버에서 git pull 만 하면 다음 수집부터 새 코드.
  # (requirements.txt 가 바뀌었을 때만  docker compose -f docker-compose.prod.yml build ingest)
  ingest:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      PYTHONIOENCODING: utf-8
    volumes:
      - ./ingest:/srv/ingest:ro
      - ./app:/srv/app:ro
      - ./eval:/srv/eval:ro
      - ./sql:/srv/sql:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    entrypoint: []
    command: ["python", "-m", "ingest.daily", "--help"]

volumes:
  pgdata:
