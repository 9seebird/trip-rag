# /etc/nginx/sites-available/trip.trendkit.app  (심볼릭 링크를 sites-enabled 에)
# 인증서는 certbot 이 이 파일에 443 블록을 덧붙인다:  sudo certbot --nginx -d trip.trendkit.app
#
# 검색·코스 API 는 부를 때마다 모델 비용이 나가서 앞단에서 한 번 더 막는다.
# (앱 안에도 IP당 분당·하루 전체 제한이 있다 — app/limits.py)

# limit_req_zone 은 http 블록 안이어야 한다. sites-enabled 파일은 http 블록 안에서 include 되므로 여기 둬도 된다.
limit_req_zone $binary_remote_addr zone=triprag_api:10m rate=20r/m;

server {
    listen 80;
    server_name trip.trendkit.app;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location /api/ {
        limit_req zone=triprag_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;           # 코스 짜기는 모델 응답까지 수 초 걸린다
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
