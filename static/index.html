<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반나절 — 말로 찾는 여행 코스</title>
<meta name="description" content="“비 오는 날 아이랑 갈 만한 실내”처럼 상황을 말하면 갈 곳을 찾고, 그 근처로 반나절 코스를 짜 드립니다. 한국관광공사 관광정보 기반.">
<meta property="og:title" content="반나절 — 말로 찾는 여행 코스">
<meta property="og:description" content="상황을 말하면 갈 곳과 반나절 코스를 찾아 드립니다. 제주·부산·강원.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M8 21a8 8 0 0 1 16 0' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='2.4' fill='%23fdba74'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0efe9; --ink:#1b1c1a; --ink-2:#4a4b47; --muted:#7a7a73;
  --line:#e4e2da; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f1ee; --accent-line:#bfe0d9;
  --warm:#ea580c; --warm-soft:#fdeee3; --blue:#2563eb; --blue-soft:#e6eefc; --olive:#4d7c0f; --olive-soft:#eef5e1;
  --shadow:0 1px 2px rgba(20,20,10,.05),0 6px 20px rgba(20,20,10,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121412; --surface:#1b1e1c; --surface-2:#232725; --ink:#ecece6; --ink-2:#c4c5bd; --muted:#91928a;
    --line:#2e3330; --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#12302c; --accent-line:#1f4a44;
    --warm:#fb923c; --warm-soft:#3a2416; --blue:#7aa2f7; --blue-soft:#1b2640; --olive:#a3d160; --olive-soft:#223018;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}   /* 어떤 요소가 넘쳐도 화면 전체가 옆으로 밀리지 않게 */
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:-.01em;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}

/* ── 상단 ─────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:2px}
.top nav a{font-size:13.5px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.top nav a:hover{background:var(--surface-2);color:var(--ink)}

/* ── 검색 영역 ─────────────────────────── */
.hero{padding:44px 0 26px;transition:padding .25s}
body.has-result .hero{padding:10px 0 14px}
.hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.25;margin:0 0 10px;letter-spacing:-.035em;font-weight:750}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{margin:0 0 26px;color:var(--ink-2);font-size:16px}
body.has-result .hero h1, body.has-result .hero p.lead{display:none}

.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shadow);max-width:760px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16.5px;color:var(--ink);
  padding:10px 4px;outline:none}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;padding:12px 22px;border-radius:999px}
.search button:disabled{opacity:.6;cursor:default}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;max-width:760px}
/* 지역: 버튼 하나 → 누르면 시트(폰은 아래에서 올라옴) */
.region-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.region-btn:hover{border-color:var(--accent)}
.region-btn.set{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.region-btn svg{flex:none}
.region-btn .x{margin-left:2px;color:var(--muted);font-weight:400}
.rs{padding:18px 20px 22px}
.rs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rs-head h2{margin:0;font-size:18px;letter-spacing:-.02em}
.rs-head button{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:17px}
.rs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:601px){.rs-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs-grid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;
  font-size:14.5px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.rs-grid button small{font-size:11.5px;color:var(--muted);font-weight:500}
.rs-grid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rs-grid button.all{grid-column:1/-1;flex-direction:row;justify-content:center;gap:6px}
.rs-grid button:disabled{opacity:.45;cursor:default}
.rs-note{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;max-width:760px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
body.has-result .chips{display:none}

/* ── 이해한 조건 ─────────────────────────── */
.understood{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 16px;font-size:13px;color:var(--muted);min-height:26px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-weight:600}
.pill.off{background:var(--surface-2);color:var(--muted);border-color:var(--line);font-weight:500}

/* ── 결과 + 지도 ─────────────────────────── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;padding-bottom:40px}
.main.nomap{grid-template-columns:minmax(0,1fr)}
.mapbox{position:sticky;top:14px;height:calc(100vh - 28px);max-height:540px;border-radius:var(--radius);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line)}
#map{width:100%;height:100%}
.nomap .mapbox{display:none}
@media (max-width:960px){
  .main{grid-template-columns:minmax(0,1fr)}
  .mapbox{position:relative;top:0;height:260px;order:-1}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover,.card.hl{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent-line)}
.ph{position:relative;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph img{position:absolute;inset:0}
/* 사진이 없을 때: 유형별 색 + 아이콘. 사진은 그 위에 겹쳐 두고, 못 불러오면 사진만 치운다 */
.noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--kb);color:var(--k);font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.noimg svg{width:34%;max-width:52px;height:auto;opacity:.9}
.noimg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.35),transparent 55%)}
.thumb .noimg span,.stop .noimg span{display:none}
.k-sight{--k:#0f766e;--kb:#dcefeb}   .k-culture{--k:#1d4ed8;--kb:#e2eafc}
.k-fest{--k:#9333ea;--kb:#f1e6fd}    .k-leports{--k:#0369a1;--kb:#ddeef8}
.k-food{--k:#c2410c;--kb:#fde9dc}    .k-cafe{--k:#8a5a2b;--kb:#f3e9dd}
@media (prefers-color-scheme:dark){
  .k-sight{--k:#5eead4;--kb:#15332f}  .k-culture{--k:#93b4fb;--kb:#1a2544}
  .k-fest{--k:#d8b4fe;--kb:#2c1b3d}   .k-leports{--k:#7cc4ee;--kb:#132c3b}
  .k-food{--k:#fdba74;--kb:#3a2215}   .k-cafe{--k:#e0b98c;--kb:#33271b}
  .noimg::after{display:none}
}
.ph .rank{position:absolute;left:10px;top:10px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.62);
  color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.tag.in{background:var(--blue-soft);color:var(--blue)}
.tag.out{background:var(--olive-soft);color:var(--olive)}
.tag.warn{background:var(--warm-soft);color:var(--warm)}
.tag.fest{background:var(--warm-soft);color:var(--warm)}
.tag.dist{background:var(--accent-soft);color:var(--accent)}
.card h3{margin:0;font-size:16px;line-height:1.35;letter-spacing:-.02em}
.card .addr{font-size:12.5px;color:var(--muted)}
.card .snip{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn{white-space:nowrap}
@media (max-width:600px){.brand small{display:none}.grid .ph{aspect-ratio:2/1}.search button{padding:12px 18px}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.06)}

.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* ── 코스 ─────────────────────────────── */
.course-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
@media (max-width:600px){
  .course-head{flex-direction:column;align-items:stretch}
  .ch-actions{justify-content:flex-start}
  .ch-actions .btn.primary{flex:1}
}
.course-head h2{margin:0;font-size:22px;letter-spacing:-.03em;line-height:1.3}
.course-head p{margin:4px 0 0;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:96px}
.stat b{display:block;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:17px;top:34px;bottom:-4px;width:2px;background:var(--line)}
.no{width:34px;height:34px;border-radius:50%;background:var(--warm);color:#fff;font-weight:750;display:grid;place-items:center;z-index:1;font-size:14.5px}
.tl:first-child .no{background:var(--accent);color:var(--accent-ink)}
.leg{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.stop{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:6px}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;flex:none;background:var(--surface-2)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stop h3{margin:0 0 3px;font-size:15.5px;letter-spacing:-.02em}
.stop .why{font-size:13.5px;color:var(--ink);margin:4px 0 0}
.stop .addr{font-size:12.5px;color:var(--muted)}
.stay{font-size:12px;color:var(--muted);margin:0 0 14px}
.links{display:flex;gap:10px;margin-top:5px;font-size:12.5px}
.links a{color:var(--accent);text-decoration:none;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px}

/* ── 상세 시트 ─────────────────────────── */
dialog{border:0;padding:0;border-radius:20px;max-width:560px;width:calc(100% - 24px);background:var(--surface);color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:88vh}
dialog::backdrop{background:rgba(10,12,10,.45)}
@media (max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:20px 20px 0 0;max-height:90vh}}
.dx{position:relative}
.dx .ph{aspect-ratio:16/9}
.dx .close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;z-index:2}
.dx .inner{padding:16px 20px 20px}
.dx h2{margin:6px 0 2px;font-size:21px;letter-spacing:-.03em}
.dx .ov{font-size:14.5px;color:var(--ink-2);white-space:pre-line;margin:12px 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:12px 0;padding:12px 14px;background:var(--surface-2);border-radius:12px}
.facts dt{color:var(--muted);white-space:nowrap}
.facts dd{margin:0;white-space:pre-line}

footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:12.5px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;
  font-size:13.5px;z-index:50;box-shadow:var(--shadow)}

/* 지도 위 번호 표시 */
.mk{width:28px;height:28px;border-radius:50%;background:var(--warm);color:#fff;font:700 13px/28px "Pretendard Variable",sans-serif;
  text-align:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.mk.s{background:#0f766e}
.mk.dot{width:22px;height:22px;line-height:18px;font-size:11px;background:#0f766e}
.mk.on{transform:scale(1.25)}
.mk.me{width:18px;height:18px;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.2),0 2px 6px rgba(0,0,0,.3)}

/* 날씨 한 줄 */
.wx{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:-6px 0 16px;padding:10px 14px;border-radius:12px;
  font-size:13.5px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.wx:empty{display:none}
.wx svg{flex:none}
.wx.rain{background:var(--blue-soft);border-color:transparent;color:var(--ink)}
.wx b{color:var(--ink)}
.wx .btn{padding:6px 12px;font-size:13px}
.wx small{color:var(--muted)}

/* 코스 장소 바꾸기 */
.swap{border:0;background:none;padding:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.swap:hover{color:var(--accent)}
.alts{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.alts.open{display:grid;gap:6px}
.alt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:6px 8px;font:inherit;color:var(--ink);cursor:pointer}
.alt:hover{border-color:var(--accent)}
.alt .thumb{width:44px;height:44px;border-radius:8px}
.alt b{display:block;font-size:13.5px}
.alt small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><i><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 22a9 9 0 0 1 18 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="11" r="3" fill="#fdba74"/></svg></i>반나절<small>말로 찾는 여행 코스</small></a>
    <nav><a href="/lab" title="검색 방식을 나란히 비교해 보는 화면">검색 실험실</a></nav>
  </header>

  <section class="hero">
    <h1>지금 상황을 말하면,<br><em>갈 곳과 반나절 코스</em>를 찾아 드려요</h1>
    <p class="lead">“비 오는 날 아이랑 갈 만한 실내”처럼 편하게 적어 주세요. 한국관광공사 관광정보에서 찾습니다.</p>
    <form class="search" id="f" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search"
             placeholder="비 오는 날 아이랑 갈 만한 실내" aria-label="어떤 곳을 찾으세요?">
      <button id="go" type="submit">찾기</button>
    </form>
    <div class="row">
      <button type="button" class="region-btn" id="regionBtn" aria-haspopup="dialog"></button>
      <button type="button" class="region-btn" id="nearBtn"></button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="understood" id="understood"></div>
  <div class="wx" id="wx" aria-live="polite"></div>

  <div class="main nomap" id="main">
    <div id="pane"></div>
    <div class="mapbox"><div id="map"></div></div>
  </div>

  <footer>
    <b>관광정보 출처</b> 한국관광공사 (TourAPI · 공공데이터포털). 장소 사진의 저작권은 한국관광공사와 원 저작자에게 있습니다.<br>
    코스의 이동 시간은 직선거리로 어림한 값이고, 장소 설명은 AI가 원문에서 골라 적은 것입니다. 운영시간·휴무는 방문 전에 꼭 확인해 주세요.<br>
    만든 사람 9seebird · <a href="/lab">검색 방식 비교</a>
  </footer>
</div>

<dialog id="dlg"></dialog>
<dialog id="regionDlg" aria-label="지역 선택"></dialog>

<script>
const $ = s => document.querySelector(s);
const EXAMPLES = [
  "비 오는 날 아이랑 갈 만한 실내",
  "바다 보면서 커피 마실 곳",
  "혼자 조용히 걷기 좋은 곳",
  "해운대 근처 저녁 맛집",
  "강릉 바다 보이는 산책길",
  "제주 흑돼지 맛집",
];
const FIELD = {indoor:"실내/실외", pet:"반려동물", baby:"아이 동반", types:"장소 유형", area:"지역"};
const state = {area: null, near: null, regions: [], items: [], last: null, course: null,
               map: null, overlays: [], line: null, kakao: false};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const https = u => u ? u.replace(/^http:\/\//, "https://") : "";
const shortAddr = a => (a || "").split(" ").slice(0, 3).join(" ");
const hm = m => m >= 60 ? `${Math.floor(m/60)}시간${m%60 ? " " + m%60 + "분" : ""}` : `${m}분`;
function kmBetween(a, b){
  const r = Math.PI / 180, p1 = a.lat * r, p2 = b.lat * r;
  const h = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((b.lon - a.lon) * r / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}

function toast(msg){
  const t = Object.assign(document.createElement("div"), {className: "toast", textContent: msg});
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

async function api(url){
  const r = await fetch(url);
  if (!r.ok){
    let m = `요청 실패 (${r.status})`;
    try { const j = await r.json(); if (j.detail) m = j.detail; } catch {}
    throw new Error(m);
  }
  return r.json();
}

// ── 시작: 지역 목록과 지도 키 ─────────────────────────────
async function boot(){
  EXAMPLES.forEach(t => {
    const b = Object.assign(document.createElement("button"), {className: "chip", type: "button", textContent: t});
    b.onclick = () => { $("#q").value = t; search(); };
    $("#chips").appendChild(b);
  });
  let cfg = {regions: [], kakao_js_key: ""};
  try { cfg = await api("/api/config"); } catch (e) { console.warn(e); }
  state.regions = cfg.regions || [];
  renderRegions(); renderNear();
  if (cfg.kakao_js_key) loadKakao(cfg.kakao_js_key);

  const p = new URLSearchParams(location.search);
  const q = p.get("q");
  if (q){ $("#q").value = q; await search(false); }
  if (p.get("course")){                       // 공유받은 코스 링크로 바로 들어온 경우
    view.direct = true;
    history.replaceState({course: p.get("course")}, "", location.href);
    course(p.get("course"));
  }
}

// 전국 17개 시도 (TourAPI areaCode). 아직 색인이 없는 곳은 '준비 중' 으로 흐리게 보여준다
const ALL_AREAS = [[1,"서울"],[2,"인천"],[31,"경기"],[32,"강원"],[3,"대전"],[8,"세종"],[33,"충북"],[34,"충남"],
  [4,"대구"],[35,"경북"],[6,"부산"],[7,"울산"],[36,"경남"],[5,"광주"],[37,"전북"],[38,"전남"],[39,"제주"]];
const PIN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function areaName(code){ return (ALL_AREAS.find(a => a[0] === code) || [0, String(code)])[1]; }

function renderRegions(){
  const b = $("#regionBtn");
  b.classList.toggle("set", !!state.area);
  b.innerHTML = `${PIN}<span>지역: ${state.area ? esc(areaName(state.area)) : "전체"}</span><span class="x">▾</span>`;
  b.setAttribute("aria-label", `지역 선택, 지금 ${state.area ? areaName(state.area) : "전체"}`);
}

function openRegions(){
  const have = new Map(state.regions.map(r => [r.code, r]));
  const total = state.regions.reduce((n, r) => n + (r.indexed || 0), 0);
  const pending = ALL_AREAS.filter(([c]) => !have.has(c)).length;
  const dlg = $("#regionDlg");
  dlg.innerHTML = `<div class="rs">
    <div class="rs-head"><h2>지역 선택</h2><button type="button" aria-label="닫기" data-close>×</button></div>
    <div class="rs-grid">
      <button type="button" class="all ${state.area ? "" : "on"}" data-a="">전체<small>${total.toLocaleString()}곳</small></button>
      ${ALL_AREAS.map(([c, n]) => {
        const r = have.get(c);
        return `<button type="button" data-a="${c}" class="${state.area === c ? "on" : ""}" ${r ? "" : "disabled"}>
          ${n}<small>${r ? r.indexed.toLocaleString() + "곳" : "준비 중"}</small></button>`;
      }).join("")}
    </div>
    ${pending ? `<p class="rs-note">‘준비 중’인 지역은 매일 조금씩 모으고 있어요. 질문에 “경주”, “여수”처럼 지명을 적어도 지역을 알아들어요.</p>` : ""}
  </div>`;
  openSheet(dlg);
}

$("#regionBtn").onclick = openRegions;

// ── 내 근처 ────────────────────────────────────────────────
const NEAR_KM = 10;
const LOC = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
function renderNear(){
  const b = $("#nearBtn");
  b.classList.toggle("set", !!state.near);
  b.innerHTML = state.near ? `${LOC}<span>내 근처 ${state.near.r}km</span><span class="x">✕</span>` : `${LOC}<span>내 근처</span>`;
  b.setAttribute("aria-label", state.near ? "내 근처 검색 끄기" : "내 위치 근처에서 찾기");
  $("#regionBtn").style.opacity = state.near ? .5 : "";
}
$("#nearBtn").onclick = () => {
  if (state.near){ state.near = null; renderNear(); if ($("#q").value.trim()) search(); return; }
  if (!navigator.geolocation){ toast("이 브라우저는 위치를 지원하지 않아요."); return; }
  const b = $("#nearBtn");
  b.disabled = true; b.querySelector("span").textContent = "위치 확인 중…";
  navigator.geolocation.getCurrentPosition(pos => {
    b.disabled = false;
    const {latitude: lat, longitude: lon} = pos.coords;
    if (lat < 33 || lat > 39 || lon < 124 || lon > 132){          // 국내 데이터만 있다
      renderNear(); toast("국내에서만 쓸 수 있어요. 지역을 골라 찾아 주세요."); return;
    }
    state.near = {lat, lon, r: NEAR_KM};
    renderNear();
    if (!$("#q").value.trim()) $("#q").value = "가볼 만한 곳";
    search();
  }, err => {
    b.disabled = false; renderNear();
    toast(err.code === 1 ? "위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치를 허용해 주세요."
                         : "위치를 가져오지 못했어요. 잠시 뒤 다시 눌러 주세요.");
  }, {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000});
};

// ── 날씨 (기상청 단기예보) ──────────────────────────────────
const UMB = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v6a2 2 0 0 1-4 0"/></svg>';
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
let wxSeq = 0;
async function loadWeather(pt, ctx){
  const box = $("#wx");
  box.className = "wx"; box.innerHTML = "";
  if (!pt || pt.lat == null) return;
  const my = ++wxSeq;
  let w;
  try { w = await api(`/api/weather?lat=${pt.lat.toFixed(3)}&lon=${pt.lon.toFixed(3)}`); } catch { return; }
  if (my !== wxSeq || !w.ok) return;                      // 늦게 온 응답·기상청 미신청이면 조용히
  const temp = w.tmp_min != null ? ` · ${w.tmp_min}~${w.tmp_max}°` : "";
  if (!w.rain){
    box.innerHTML = `${SUN}<span>앞으로 12시간 <b>${esc(w.sky || "비 소식 없음")}</b>${temp}</span><small>기상청 단기예보</small>`;
    return;
  }
  box.classList.add("rain");
  const when = w.rain_from ? `${w.rain_from}쯤부터 ${esc(w.rain_kind || "비")} 소식` : `비 올 확률 최대 ${w.pop_max}%`;
  let act = "";
  if (ctx === "list"){
    const indoor = state.last?.filters?.indoor === true;
    act = indoor ? `<small>실내 위주로 찾았어요</small>`
                 : `<button class="btn" type="button" id="wxIndoor">실내로 다시 찾기</button>`;
  } else {
    act = `<small>야외 장소는 우산을 챙기세요</small>`;
  }
  box.innerHTML = `${UMB}<span><b>${when}</b>${temp}</span>${act}`;
  $("#wxIndoor")?.addEventListener("click", () => { $("#q").value = $("#q").value.trim() + " 실내"; search(); });
}
$("#regionDlg").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]");
  if (b && !b.disabled){
    state.area = b.dataset.a ? Number(b.dataset.a) : null;
    state.near = null;
    renderRegions(); renderNear();
    await closeSheet($("#regionDlg"));
    if ($("#q").value.trim()) search();
    return;
  }
  if (e.target === e.currentTarget || e.target.closest("[data-close]")) closeSheet($("#regionDlg"));
});

// ── 화면 이동과 뒤로 가기 ───────────────────────────────────
// 폰에서 '뒤로' 를 누르면 사이트를 나가지 않고 한 단계 전(시트 닫기 / 코스 → 목록)으로 가게
// 시트·코스를 열 때마다 history 에 한 칸씩 쌓는다.
let skipPop = null;                       // 우리가 부른 history.back() 이 끝나길 기다리는 중
const view = {listY: 0};                  // 목록에서 코스로 갈 때의 스크롤 위치 (돌아오면 복원)

function openSheet(d){
  d.showModal();
  history.pushState({...(history.state || {}), sheet: d.id}, "", location.href);
}
function closeSheet(d){
  if (!d.open) return Promise.resolve();
  d.close();
  if (!history.state?.sheet) return Promise.resolve();
  return new Promise(res => { skipPop = res; history.back(); });
}
document.querySelectorAll("dialog").forEach(d =>
  d.addEventListener("cancel", e => { e.preventDefault(); closeSheet(d); }));   // Esc

function courseUrl(id, swaps){
  const p = new URLSearchParams(location.search);
  id ? p.set("course", id) : p.delete("course");
  // 바꾼 장소도 주소에 담아 공유받은 사람이 같은 코스를 보게 (칸:장소id,…)
  const sw = id && swaps && Object.entries(swaps).map(([k, v]) => `${k}:${v}`).join(",");
  sw ? p.set("swap", sw) : p.delete("swap");
  return "?" + p.toString();
}

function openCourse(id){
  const dlg = $("#dlg");
  if (!history.state?.course) view.listY = window.scrollY;
  if (dlg.open && history.state?.sheet){          // 상세 시트에서 바로 코스로: 시트 칸을 코스 칸으로 바꾼다
    dlg.close();
    history.replaceState({course: id}, "", courseUrl(id));
  } else {
    if (dlg.open) dlg.close();
    history.pushState({course: id}, "", courseUrl(id));
  }
  course(id);
}

function backToList(){
  // 목록에서 들어왔으면 뒤로 가기와 같게 (popstate 가 목록을 그린다). 링크로 바로 들어왔으면 뒤가 없으니 그 자리에서 목록으로
  if (history.state?.course && !view.direct){ history.back(); return; }
  view.direct = false;
  showList();
}
function showList(){
  if (new URLSearchParams(location.search).has("course")) history.replaceState(null, "", courseUrl(null));
  renderResults();
  requestAnimationFrame(() => window.scrollTo(0, view.listY));
}

window.addEventListener("popstate", e => {
  if (skipPop){ const r = skipPop; skipPop = null; r(); return; }
  const open = document.querySelector("dialog[open]");
  if (open){ open.close(); return; }                      // 뒤로 = 시트 닫기
  const s = e.state || {};
  if (s.course) course(s.course);
  else if (state.items.length) showList();
});

// 화면이 바뀌면 결과가 시작하는 곳으로 바로 (부드러운 스크롤은 내용이 바뀌는 중에 끊겨서 쓰지 않는다)
function toResultsTop(){
  const y = $("#understood").getBoundingClientRect().top + window.scrollY - 8;
  window.scrollTo(0, Math.max(0, y));
}

// ── 지도 (카카오) ─────────────────────────────────────────
function loadKakao(key){
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
  s.onload = () => kakao.maps.load(() => {
    state.kakao = true;
    state.map = new kakao.maps.Map($("#map"), {center: new kakao.maps.LatLng(36.3, 127.8), level: 13});
    state.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    if (state.pending) { state.pending(); state.pending = null; }
  });
  s.onerror = () => console.warn("카카오 지도를 불러오지 못했습니다 (키·도메인 등록 확인)");
  document.head.appendChild(s);
}

function mapReady(fn){
  // 지도 SDK 가 아직 안 떴으면, 뜬 뒤에 같은 경로(지도 칸 보이기 → 크기 다시 잡기 → 그리기)로 다시 탄다
  if (!state.kakao){ state.pending = () => mapReady(fn); return; }
  {
    $("#main").classList.remove("nomap");
    // 레이아웃이 바뀐 뒤에 크기를 다시 잡아야 지도가 회색으로 안 나온다
    requestAnimationFrame(() => { state.map.relayout(); fn(); });
  }
}

function clearMap(){
  state.overlays.forEach(o => o.setMap(null)); state.overlays = [];
  if (state.line){ state.line.setMap(null); state.line = null; }
}

function mark(lat, lon, label, cls, onClick){
  const el = document.createElement("div");
  el.className = "mk " + cls; el.textContent = label;
  if (onClick) el.onclick = onClick;
  const o = new kakao.maps.CustomOverlay({position: new kakao.maps.LatLng(lat, lon), content: el, yAnchor: .5, xAnchor: .5});
  o.setMap(state.map); state.overlays.push(o);
  return el;
}

function fit(points){
  if (!points.length) return;
  const b = new kakao.maps.LatLngBounds();
  points.forEach(p => b.extend(new kakao.maps.LatLng(p.lat, p.lon)));
  state.map.setBounds(b, 40, 40, 40, 40);
}

function mapResults(items){
  mapReady(() => {
    clearMap();
    const pts = items.filter(i => i.lat && i.lon);
    pts.forEach(i => {
      const idx = items.indexOf(i);
      const el = mark(i.lat, i.lon, idx + 1, "dot", () => {
        const c = document.querySelector(`[data-card="${i.content_id}"]`);
        if (c){ c.scrollIntoView({behavior: "smooth", block: "center"}); flash(c); }
      });
      el.dataset.mk = i.content_id;
    });
    if (state.near){                                       // 내 위치 표시, 내 위치 + 결과 전부가 보이게
      mark(state.near.lat, state.near.lon, "", "me");
      fit([state.near, ...pts]);
    } else fit(focusGroup(pts));
  });
}

// 결과가 여러 지역에 흩어져 있으면 전부 담으려다 전국 지도가 된다.
// 1위가 있는 지역에 맞추고, 다른 지역 번호는 지도를 움직이면 보인다.
function focusGroup(pts){
  if (!pts.length) return pts;
  const top = pts[0].area_code;
  const same = pts.filter(p => p.area_code === top);
  return same.length ? same : pts;
}

function mapCourse(all){
  mapReady(() => {
    clearMap();
    all.forEach((s, i) => mark(s.lat, s.lon, i + 1, i ? "" : "s"));
    state.line = new kakao.maps.Polyline({
      path: all.map(s => new kakao.maps.LatLng(s.lat, s.lon)),
      strokeWeight: 4, strokeColor: "#ea580c", strokeOpacity: .85, strokeStyle: "shortdash"});
    state.line.setMap(state.map);
    fit(all);
  });
}

function panTo(id){
  if (!state.kakao || $("#main").classList.contains("nomap")) return;
  const r = state.items.find(x => String(x.content_id) === String(id));
  if (!r || !r.lat) return;
  const pos = new kakao.maps.LatLng(r.lat, r.lon);
  if (state.map.getBounds().contain(pos)) return;       // 이미 보이면 가만히
  // 다른 지역(제주 → 강원)처럼 멀면 동네가 보이게 확대해서 옮기고, 가까우면 부드럽게 민다
  const c = state.map.getCenter();
  const far = Math.abs(c.getLat() - r.lat) + Math.abs(c.getLng() - r.lon) > 1;
  if (far){ state.map.setLevel(Math.min(state.map.getLevel(), 9)); state.map.setCenter(pos); }
  else state.map.panTo(pos);
}

function flash(el){ el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1400); }

// ── 검색 ─────────────────────────────────────────────────
async function search(push = true){
  const q = $("#q").value.trim();
  if (!q) { $("#q").focus(); return; }
  if (push) history.replaceState(null, "", "?q=" + encodeURIComponent(q));
  view.listY = 0;
  document.body.classList.add("has-result");
  $("#go").disabled = true;
  $("#understood").innerHTML = "";
  $("#wx").innerHTML = "";
  $("#pane").innerHTML = `<div class="grid">${Array.from({length: 6}, () =>
    `<div class="card"><div class="ph sk"></div><div class="body"><div class="sk" style="height:16px;width:60%"></div>
     <div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:30px"></div></div></div>`).join("")}</div>`;
  try{
    const where = state.near
      ? `&lat=${state.near.lat.toFixed(4)}&lon=${state.near.lon.toFixed(4)}&radius=${state.near.r}`
      : (state.area ? "&area=" + state.area : "");
    const d = await api(`/api/find?q=${encodeURIComponent(q)}&limit=12${where}`);
    state.items = d.items || [];
    state.last = d;
    renderUnderstood(d);
    renderResults();
    if (push) toResultsTop();
    loadWeather(state.near || state.items.find(i => i.lat != null), "list");
  }catch(e){
    $("#pane").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }finally{
    $("#go").disabled = false;
  }
}

function renderUnderstood(d){
  const parts = (d.extracted || []).filter(w => !(w.field === "area" && state.area)).map(w =>
    `<span class="pill" title="“${esc(w.matched)}”에서 알아들음">${esc(w.label)}</span>`);
  if (d.near && state.near) parts.unshift(`<span class="pill">내 근처 ${state.near.r}km</span>`);
  else if (state.area) parts.unshift(`<span class="pill">${esc(areaName(state.area))}</span>`);
  const dropped = (d.dropped_filters || []).map(f => `<span class="pill off">${FIELD[f] || f} 조건은 맞는 곳이 적어 넓혀서 찾음</span>`);
  $("#understood").innerHTML = parts.length || dropped.length
    ? `<span>이렇게 이해했어요</span>${parts.join("")}${dropped.join("")}` : "";
}

const md = d => { const [, m, dd] = String(d).split("-"); return `${+m}.${+dd}`; };
function badges(r){
  const b = [`<span class="tag">${esc(r.type)}</span>`];
  if (r.dist_km != null) b.push(`<span class="tag dist">${r.dist_km < 1 ? Math.round(r.dist_km * 1000) + "m" : r.dist_km + "km"}</span>`);
  if (r.event_start) b.push(`<span class="tag fest">${md(r.event_start)}${r.event_end && r.event_end !== r.event_start ? "~" + md(r.event_end) : ""}</span>`);
  if (r.indoor === true) b.push(`<span class="tag in">실내</span>`);
  if (r.indoor === false) b.push(`<span class="tag out">야외</span>`);
  if (r.baby_ok === false) b.push(`<span class="tag warn">유모차 어려움</span>`);
  if (r.baby_ok === true) b.push(`<span class="tag in">유모차 가능</span>`);
  return b.join("");
}

const ICON = {
  sight:   '<path d="m3 20 6-10 4 6 3-4 5 8z"/><circle cx="16" cy="6" r="2"/>',
  culture: '<path d="M3 10 12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
  fest:    '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  leports: '<path d="M2 17c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><circle cx="15" cy="6" r="2"/><path d="m8 13 3-4 3 2 2-2"/>',
  food:    '<path d="M7 3v7a2 2 0 0 0 2 2M11 3v7a2 2 0 0 1-2 2v9M17 21V3c-2 1-3 4-3 7s1 4 3 4"/>',
  cafe:    '<path d="M4 9h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>',
};
const KIND_LABEL = {sight: "볼거리", culture: "문화시설", fest: "축제·행사", leports: "레포츠", food: "음식점", cafe: "카페"};
const TYPE_BY_NAME = {"관광지": 12, "문화시설": 14, "축제공연행사": 15, "레포츠": 28, "음식점": 39};
function kindOf(r){
  const t = r.content_type ?? TYPE_BY_NAME[r.type];
  if (t === 39) return (r.slot === "cafe" || /카페|커피|cafe|coffee|베이커리|디저트/i.test(r.title || "")) ? "cafe" : "food";
  return {14: "culture", 15: "fest", 28: "leports"}[t] || "sight";
}
function photo(r){
  const k = kindOf(r);
  const ph = `<div class="noimg k-${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg><span>${KIND_LABEL[k]}</span></div>`;
  return ph + (r.image ? `<img src="${esc(https(r.image))}" alt="" loading="lazy" onerror="this.remove()">` : "");
}

function renderResults(){
  const items = state.items;
  if (!items.length){
    $("#pane").innerHTML = state.near
      ? `<div class="empty">내 근처 ${state.near.r}km 안에서 딱 맞는 곳을 못 찾았어요.<br>‘내 근처’를 끄거나 조금 다르게 적어 보세요.</div>`
      : `<div class="empty">딱 맞는 곳을 못 찾았어요.<br>지역을 ‘전체’로 바꾸거나 조금 다르게 적어 보세요.</div>`;
    return;
  }
  $("#pane").innerHTML = `<div class="grid">${items.map((r, i) => `
    <article class="card" data-card="${r.content_id}">
      <div class="ph">${photo(r)}<span class="rank">${i + 1}</span></div>
      <div class="body">
        <div class="tags">${badges(r)}</div>
        <h3>${esc(r.title)}</h3>
        <div class="addr">${esc(shortAddr(r.addr))}</div>
        <p class="snip">${esc(r.snippet)}</p>
        <div class="actions">
          <button class="btn" data-detail="${r.content_id}">자세히</button>
          <button class="btn primary" data-course="${r.content_id}">여기서 반나절 코스</button>
        </div>
      </div>
    </article>`).join("")}</div>`;
  $("#pane").querySelectorAll("[data-card]").forEach(c => {
    c.onmouseenter = () => {
      document.querySelector(`[data-mk="${c.dataset.card}"]`)?.classList.add("on");
      // 카드에 잠깐 머물면(훑고 지나가는 건 무시) 그 장소가 지도 밖일 때만 지도를 옮긴다
      clearTimeout(state.hoverT);
      state.hoverT = setTimeout(() => panTo(c.dataset.card), 250);
    };
    c.onmouseleave = () => {
      clearTimeout(state.hoverT);
      document.querySelector(`[data-mk="${c.dataset.card}"]`)?.classList.remove("on");
    };
  });
  mapResults(items);
}

// ── 상세 ─────────────────────────────────────────────────
function detail(id){
  const r = state.items.find(x => String(x.content_id) === String(id));
  if (!r) return;
  const facts = [["운영시간", r.usetime], ["쉬는 날", r.restdate], ["요금", r.usefee], ["대표 메뉴", r.menu],
                 ["주차", r.parking], ["문의", r.tel]].filter(([, v]) => v && String(v).trim());
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dx">
    <button class="close" aria-label="닫기" data-close>×</button>
    <div class="ph">${photo(r)}</div>
    <div class="inner">
      <div class="tags">${badges(r)}</div>
      <h2>${esc(r.title)}</h2>
      <div class="addr" style="color:var(--muted);font-size:13.5px">${esc(r.addr)}</div>
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
      <div class="ov">${esc(r.overview || r.snippet)}</div>
      <div class="actions">
        ${r.lat ? `<a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/${encodeURIComponent(r.title)},${r.lat},${r.lon}">카카오맵</a>` : ""}
        <button class="btn primary" data-course="${r.content_id}" data-close>여기서 반나절 코스</button>
      </div>
    </div></div>`;
  openSheet(dlg);
}
$("#dlg").addEventListener("click", e => {
  if (e.target.closest("[data-course]")) return;      // 아래 문서 클릭 처리기가 코스로 보낸다
  if (e.target === e.currentTarget || e.target.closest("[data-close]")) closeSheet($("#dlg"));
});

// 카카오맵 길찾기 URL: /link/by/car/출발,위도,경도/경유,위도,경도/.../도착,위도,경도
// 이름에 쉼표·슬래시가 있으면 URL 이 깨져서 공백으로 바꾼다
function routeLink(stops){
  const seg = s => `${encodeURIComponent((s.title || "").replace(/[,/]/g, " "))},${s.lat},${s.lon}`;
  return "https://map.kakao.com/link/by/car/" + stops.map(seg).join("/");
}

// ── 코스 ─────────────────────────────────────────────────
async function course(id){
  document.body.classList.add("has-result");
  $("#pane").innerHTML = `<div class="empty">근처에서 볼거리·식사·카페를 골라 코스를 짜는 중이에요…</div>`;
  $("#wx").innerHTML = "";
  toResultsTop();
  try{
    const d = await api(`/api/course?id=${encodeURIComponent(id)}`);
    if (d.error) throw new Error(d.error);
    d.id = String(id);
    d.swaps = {};
    // 공유받은 주소에 바꾼 장소가 있으면 그대로 적용
    const p = new URLSearchParams(location.search);
    if (p.get("course") === String(id) && p.get("swap")){
      for (const part of p.get("swap").split(",")){
        const [k, v] = part.split(":");
        swapStop(d, k, v);
      }
    }
    state.course = d;
    renderCourse();
    loadWeather(d.start, "course");
  }catch(e){
    $("#pane").innerHTML = `<div class="empty">코스를 짜지 못했어요: ${esc(e.message)}<br><button class="btn" style="margin-top:12px" onclick="backToList()">목록으로</button></div>`;
  }
}

// 칸(slot_key)의 장소를 후보 중 다른 곳으로 바꾸고, 구간 거리·시간·합계를 다시 계산한다
function swapStop(d, key, cid){
  const i = d.stops.findIndex(s => s.slot_key === key);
  const alt = (d.candidates?.[key] || []).find(c => String(c.content_id) === String(cid));
  if (i < 0 || !alt) return false;
  d.stops[i] = {...alt, reason: "직접 고른 곳"};
  d.swaps[key] = alt.content_id;
  const rf = d.road_factor || 1.3, kmh = d.kmh || 40;
  let prev = d.start, moveKm = 0;
  for (const s of d.stops){
    const km = kmBetween(prev, s);
    s.leg_km = Math.round(km * 10) / 10;
    s.leg_min = Math.max(5, Math.ceil(km * rf / kmh * 60 / 5) * 5);
    moveKm += km; prev = s;
  }
  const move = d.stops.reduce((n, s) => n + s.leg_min, 0);
  const stay = 60 + d.stops.reduce((n, s) => n + (s.stay_min || 60), 0);
  d.totals = {...d.totals, move_min: move, stay_min: stay, total_min: move + stay, move_km: Math.round(moveKm * 10) / 10};
  d.edited = true;
  return true;
}

function renderCourse(){
  const d = state.course;
  const all = [d.start, ...d.stops];
  const used = new Set(all.map(s => String(s.content_id)));
  const t = d.totals;
  const alts = s => (d.candidates?.[s.slot_key] || []).filter(c => !used.has(String(c.content_id)));
  $("#pane").innerHTML = `
    <div class="course-head">
      <div><h2>${esc(d.start.title)}에서 시작하는 반나절</h2>
        <p>${esc(d.edited ? "직접 바꾼 코스예요. 이동 거리·시간은 다시 계산했어요."
                          : (d.summary || "가까운 곳부터 돌기 좋은 순서로 골랐어요."))}</p></div>
      <div class="ch-actions">
        <a class="btn primary" style="flex:none" target="_blank" rel="noopener" href="${routeLink(all)}">카카오맵으로 전체 경로</a>
        <button class="btn" type="button" id="share">공유</button>
        <button class="btn" type="button" id="back">← 목록</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${hm(t.total_min)}</b><span>전체</span></div>
      <div class="stat"><b>${hm(t.move_min)}</b><span>이동 · ${t.move_km}km</span></div>
      <div class="stat"><b>${all.length}곳</b><span>방문</span></div>
    </div>
    <ol class="timeline">${all.map((s, i) => {
      const others = i ? alts(s) : [];
      return `
      <li class="tl"><div class="no">${i + 1}</div><div>
        ${i ? `<p class="leg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14M7 17l1.5-5h7L17 17M8 12l1-3h6l1 3"/></svg>차로 약 ${s.leg_min}분 · ${s.leg_km}km</p>` : ""}
        <div class="stop">
          <div class="thumb">${photo(s)}</div>
          <div style="min-width:0;flex:1">
            <div class="tags"><span class="tag">${esc(i ? s.slot_name : "출발")}</span>${s.indoor === true ? `<span class="tag in">실내</span>` : ""}</div>
            <h3>${esc(s.title)}</h3>
            <div class="addr">${esc(shortAddr(s.addr))}</div>
            ${i && s.reason ? `<p class="why">${esc(s.reason)}</p>` : ""}
            <div class="links">
              <a target="_blank" rel="noopener" href="https://map.kakao.com/link/map/${encodeURIComponent(s.title)},${s.lat},${s.lon}">지도</a>
              ${i ? `<a target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${encodeURIComponent(s.title)},${s.lat},${s.lon}">길찾기</a>` : ""}
              ${others.length ? `<button class="swap" type="button" data-swap="${esc(s.slot_key)}" aria-expanded="false" aria-label="다른 ${esc(s.slot_name)}로 바꾸기">다른 곳 ▾</button>` : ""}
            </div>
            ${others.length ? `<div class="alts" id="alts-${esc(s.slot_key)}">${others.map(c => `
              <button class="alt" type="button" data-pick="${esc(s.slot_key)}:${c.content_id}">
                <div class="thumb">${photo(c)}</div>
                <div><b>${esc(c.title)}</b><small>${esc(shortAddr(c.addr))} · 출발지에서 ${c.km}km</small></div>
              </button>`).join("")}</div>` : ""}
          </div>
        </div>
        <p class="stay">머무는 시간 약 ${hm(i ? s.stay_min : 60)}</p>
      </div></li>`;
    }).join("")}
    </ol>
    <div class="note">${d.source === "llm"
      ? "AI가 근처 후보 중에서 골랐고, 없는 장소를 지어내지 않도록 후보 밖 선택은 걸러냈어요."
      : "가까운 곳을 기준으로 규칙에 따라 골랐어요."} 이동 시간은 직선거리로 어림한 값이에요.</div>`;
  $("#back").onclick = backToList;
  $("#share").onclick = shareCourse;
  mapCourse(all);
}

$("#pane").addEventListener("click", e => {
  const sw = e.target.closest("[data-swap]");
  if (sw){
    const box = document.getElementById("alts-" + sw.dataset.swap);
    const open = box.classList.toggle("open");
    sw.setAttribute("aria-expanded", open);
    return;
  }
  const pk = e.target.closest("[data-pick]");
  if (pk && state.course){
    const [key, cid] = pk.dataset.pick.split(":");
    if (swapStop(state.course, key, cid)){
      history.replaceState(history.state, "", courseUrl(state.course.id, state.course.swaps));
      const y = window.scrollY;
      renderCourse();
      window.scrollTo(0, y);
      toast("코스를 바꿨어요");
    }
  }
});

async function shareCourse(){
  const d = state.course;
  const url = location.origin + location.pathname + courseUrl(d.id, d.swaps);
  const title = `${d.start.title}에서 시작하는 반나절`;
  const text = [d.start, ...d.stops].map((s, i) => `${i + 1}. ${s.title}`).join("\n");
  if (navigator.share){
    try { await navigator.share({title, text, url}); return; }
    catch (e) { if (e.name === "AbortError") return; }      // 사용자가 닫음
  }
  try { await navigator.clipboard.writeText(`${title}\n${text}\n${url}`); toast("코스 링크를 복사했어요"); }
  catch {
    // 클립보드 권한이 없는 브라우저: 숨은 입력칸으로 복사
    const ta = Object.assign(document.createElement("textarea"), {value: url});
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand("copy");
    ta.remove();
    toast(ok ? "코스 링크를 복사했어요" : "주소창의 주소를 복사해 공유해 주세요");
  }
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-course]");
  if (c){ openCourse(c.dataset.course); return; }
  const d = e.target.closest("[data-detail]");
  if (d) detail(d.dataset.detail);
});
$("#f").addEventListener("submit", e => { e.preventDefault(); search(); });
boot();
</script>
