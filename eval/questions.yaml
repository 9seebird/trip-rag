# 평가 질문 20개.
#
# 정답(expect)은 손으로 적지 않는다. 대신 여러 검색 방식으로 후보를 모아(pooling)
# 모델에게 하나씩 "이 질문의 답이 되는가" 를 판정시키고, 사람이 검수한다.
#   docker compose run --rm ingest python -m eval.build_pool
# 이렇게 하면 특정 검색 방식에 유리하게 정답을 고르는 편향을 줄일 수 있다.
#
# kind
#   situation : 상황·분위기로 찾는 질문. 의미 검색이 유리해야 정상
#   condition : 조건이 섞인 질문. 조건 필터가 일해야 정상
#   proper    : 고유명사. 키워드 검색이 이겨야 정상 (이게 있어야 비교가 정직하다)

